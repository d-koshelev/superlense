[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superlense-copilot-ui-self-learning-lab"
version = "0.1.0"
description = "Local evidence-based UI learning laboratory"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
copilot-ui-lab = "copilot_ui_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
